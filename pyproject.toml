[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "query-subdata-discovery"
version = "0.1.0"
description = "LLM-free hierarchical Query-to-SubData selection inspired by LightSTAR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8; platform_machine != 'arm64'",
    "hnswlib>=0.8",
    "pandas>=2.0",
    "pyarrow>=14.0",
]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
